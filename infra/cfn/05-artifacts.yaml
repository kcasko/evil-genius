AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated Evil Genius deployment artifacts; no shared CDK bootstrap.
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryBuildSources
            Status: Enabled
            ExpirationInDays: 45
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: evil-genius
Outputs:
  ArtifactBucket:
    Value: !Ref Artifacts
